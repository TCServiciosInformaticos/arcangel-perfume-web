name: Prepare Dove catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-dove-catalog.yml
      - scripts/prepare-dove-catalog.py
      - scripts/validate-dove-catalog.ts
      - scripts/catalog-data/dove.json
permissions:
  contents: write
concurrency:
  group: prepare-dove-catalog
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3 Pillow==12.0.0
      - name: Prepare official Doan Dove catalog
        run: python scripts/prepare-dove-catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate import rules and Dove catalog
        run: |
          npx --yes tsx@4.20.6 --test scripts/catalog-import.test.ts
          npx --yes tsx@4.20.6 scripts/validate-dove-catalog.ts
      - name: Save Dove source and product images when ready
        run: |
          if [ ! -f scripts/catalog-data/dove.json ]; then exit 0; fi
          git fetch origin main
          if git cat-file -e origin/main:scripts/catalog-data/dove.json 2>/dev/null; then
            echo "Dove snapshot already stored; preserving reviewed data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-data/dove.json public/catalog/dove
          if ! git diff --cached --quiet; then
            git commit -m "Store Dove catalog source and optimized product images"
            git pull --rebase
            git push
          fi
