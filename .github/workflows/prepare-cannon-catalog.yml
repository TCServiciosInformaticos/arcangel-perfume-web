name: Prepare Cannon catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-cannon-catalog.yml
      - scripts/prepare-cannon-catalog.py
      - scripts/validate-cannon-catalog.ts
      - scripts/catalog-data/cannon.json
permissions:
  contents: write
concurrency:
  group: prepare-cannon-catalog
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3 Pillow==12.0.0
      - name: Prepare official Cannon catalog
        run: python scripts/prepare-cannon-catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate import rules and Cannon presentation coverage
        run: |
          npx --yes tsx@4.20.6 --test scripts/catalog-import.test.ts
          npx --yes tsx@4.20.6 scripts/validate-cannon-catalog.ts
      - name: Save source and product images when ready
        run: |
          if [ ! -f scripts/catalog-data/cannon.json ]; then exit 0; fi
          git fetch origin main
          if git show origin/main:scripts/catalog-data/cannon.json | python -c 'import json,sys; sys.exit(0 if json.load(sys.stdin).get("pricing")=="published" else 1)'; then
            echo "Prepared Cannon snapshot already stored; preserving reviewed data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-data/cannon.json public/catalog/cannon
          if ! git diff --cached --quiet; then
            git commit -m "Store official Cannon catalog and optimized product images"
            git pull --rebase
            git push
          fi
