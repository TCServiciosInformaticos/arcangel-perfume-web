name: Prepare Issue catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-issue-catalog.yml
      - scripts/prepare-issue-catalog.py
permissions:
  contents: write
concurrency:
  group: prepare-issue-catalog
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3 Pillow==12.0.0
      - name: Extract source catalog and store images
        run: test -f scripts/catalog-data/issue.json || python scripts/prepare-issue-catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate import rules and prepared catalog
        run: |
          npx --yes tsx@4.20.6 --test scripts/catalog-import.test.ts
          npx --yes tsx@4.20.6 scripts/validate-issue-catalog.ts
      - name: Save reviewed import source
        run: |
          git fetch origin main
          if git cat-file -e origin/main:scripts/catalog-data/issue.json 2>/dev/null; then
            echo "Issue source snapshot is already stored; preserving reviewed data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-data/issue.json public/catalog/issue
          if ! git diff --cached --quiet; then
            git commit -m "Store official Issue catalog and optimized product images"
            git pull --rebase
            git push
          fi
