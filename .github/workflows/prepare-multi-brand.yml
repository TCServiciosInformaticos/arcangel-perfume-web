name: Store reviewed multi-brand catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-multi-brand.yml]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==12.0.0 requests==2.32.5
      - run: python scripts/store-multi-brand-images.py
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npx --yes tsx@4.20.6 --test scripts/catalog-import.test.ts
          npx --yes tsx@4.20.6 scripts/validate-multi-brand.ts
      - name: Commit validated images and source snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/catalog/nivea public/catalog/cicatricure public/catalog/garnier public/catalog/dermaglos public/catalog/frenzzi scripts/catalog-data/multi-brand-20261020.json
          if ! git diff --cached --quiet; then
            git commit -m "Store Nivea Cicatricure Garnier Dermaglos and Frenzzi product photos"
            git pull --rebase
            git push
          fi
