name: Prepare Elvive catalog
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/prepare-elvive.yml, scripts/prepare-elvive.py]
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.14.3 requests==2.32.5 Pillow==12.0.0
      - name: Collect and store Elvive source and photographs
        run: python -u scripts/prepare-elvive.py
      - name: Preserve collected source and images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/catalog-data/elvive.json public/catalog/elvive
          if ! git diff --cached --quiet; then
            git commit -m "Store Elvive source prices, presentations and optimized product photographs"
            git pull --rebase
            git push
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npx --yes tsx@4.20.6 --test scripts/catalog-import.test.ts
          npx --yes tsx@4.20.6 scripts/validate-elvive.ts
