# CI checks for application code and isolated browser fixtures.
name: Quality checks

on:
  push:
    branches: [main, hostinger-usuarios, admin-operations]
    paths-ignore:
      - "public/catalog/**"
      - "scripts/catalog-data/**"
      - "**.md"
  pull_request:
    paths-ignore:
      - "public/catalog/**"
      - "scripts/catalog-data/**"
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tests, TypeScript and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run application and catalog tests
        run: npm run test
      - name: Check TypeScript
        run: npm run typecheck
      - name: Build for Vercel
        run: bun run build
        env:
          NITRO_PRESET: vercel
          VERCEL: "1"

  browser:
    name: Browser flows (desktop and mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - name: Test isolated store flows
        run: npm run test:e2e
# Validación automática
